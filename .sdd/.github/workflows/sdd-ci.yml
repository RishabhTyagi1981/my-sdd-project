name: "🔄 Autonomous SDD Pipeline"

on:
  # Job 1: Runs when the SDD Agent pushes code and opens a Pull Request
  pull_request:
    branches:
      - main
      - master
  
  # Job 2: Runs when the UI dashboard or a human sends an "approved" comment/event
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  # ==========================================
  # JOB 1: AUTOMATED VERIFICATION (TEST RUNNER)
  # ==========================================
  verify-implementation:
    name: "🧪 Run Agent Tests"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🐍 Set up Python (or Node.js/your project environment)"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ensure test framework is present
          pip install pytest pytest-cov

      - name: "🔬 Execute Test Suite"
        id: run_tests
        run: |
          # Executes the automated tests generated by your SDD Software Engineer Agent
          pytest --cov=src/ tests/ --junitxml=pytest.xml

      - name: "📊 Publish Test Results Report"
        uses: mikaelrt/junit-2-md-action@v1
        if: always()
        with:
          input: pytest.xml
          output: test-report.md

  # ==========================================
  # JOB 2: AUTONOMOUS MERGE (GATEKEEPER)
  # ==========================================
  autonomous-merge:
    name: "🚀 Auto-Merge on Approval"
    # Triggers if a PR review is approved OR a comment explicitly says "approved"
    if: >
      (github.event.review.state == 'approved') || 
      (github.event.comment.body == 'approved' && github.event.issue.pull_request != null)
    runs-on: ubuntu-latest
    
    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🤖 Authenticate & Merge Branch"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Determine PR Number based on the triggering event type
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          echo "Human approval detected. Validating pipeline status before merging..."
          
          # Use the free GitHub CLI pre-installed on GitHub Runners to verify PR status
          PR_STATUS=$(gh pr view $PR_NUMBER --json reviewDecision,mergeable -q '.reviewDecision')
          
          echo "PR State: $PR_STATUS"
          
          # Autonomously merge the PR using the Squash strategy to keep git history clean
          gh pr merge $PR_NUMBER --squash --delete-branch --admin
          
          echo "Branch successfully integrated into main branch! Pipeline complete."
